# Pipeline inputs (what data this pipeline operates on)
inputs:
  # Original full-length protein FASTA.
  #
  # This must be the same FASTA used in the cdsearch and pssm_reconstruct stages.
  query_fasta: data/processed/query.fasta

  # CD-Search top-hit table generated by the cdsearch stage.
  #
  # Required columns:
  #   - query_id
  #   - qstart
  #   - qseq
  #   - title
  cdsearch_table: results/cdsearch_extract/selected_domain_hits_detailed.tsv

  # Full-length reconstructed PSSM tables generated by pssm_reconstruct.
  #
  # Expected files:
  #   results/pssm/reconstruct/{query_id}.tsv
  reconstruct_dir: results/pssm/reconstruct

  # External Scorecons output directory.
  #
  # These files are generated outside this pipeline and should be prepared before running.
  #
  # Expected files:
  #   data/external/conservation/scorecons/{query_id}.txt
  scorecons_dir: data/external/conservation/scorecons

# Algorithm / tool parameters (affect scientific results)
parameters:
  # Amino-acid column order used by the original Branch B implementation.
  # Keep this unchanged to preserve matrix compatibility.
  aa_order: GAILVMFWPCSTYNQHKRDE

# Pipeline outputs (where artifacts will be written)
outputs:
  # Integrated full-length tables with Scorecons conservation columns.
  #
  # This directory will later be updated by the ConSurf integration stage.
  integrated_output_dir: results/pssm/integrated

# Execution behavior (does not affect scientific results)
execution:
  # If true, remove the existing integrated_output_dir before running.
  overwrite: false

  # If true, skip integrated TSV files that already exist.
  resume: true