# Pipeline inputs (what data this pipeline operates on)
inputs:
  # CD-Search top-hit table generated by the cdsearch stage.
  # Required columns:
  #   - query_id
  #   - PSSM_ID
  #   - title
  cdsearch_table: results/cdsearch_extract/selected_domain_hits_detailed.tsv

  # Root directory containing CDD .smp profile files.
  #
  # In the new project structure, .smp files are extracted to:
  #   data/external/cdd/profiles/
  #
  # The parser keeps compatibility with the old lookup behavior:
  #   <smp_root_dir>/<name>.smp
  #   <smp_root_dir>/smps/<name>.smp
  smp_root_dir: data/external/cdd/profiles

# Algorithm / tool parameters (affect scientific results)
parameters:
  # Amino-acid column order used by the original Branch B implementation.
  # Keep this unchanged to preserve feature matrix compatibility.
  aa_order: GAILVMFWPCSTYNQHKRDE

# Pipeline outputs (where artifacts will be written)
outputs:
  # Domain-level PSSM matrices parsed directly from CDD .smp files.
  matrix_output_dir: results/pssm/matrices

# Execution behavior (does not affect scientific results)
execution:
  # If true, remove the existing matrix_output_dir before running.
  overwrite: false

  # If true, skip matrix TSV files that already exist.
  # This preserves the old behavior where existing output files are skipped.
  resume: true