# Pipeline inputs (what data this pipeline operates on)
inputs:
  # Input protein FASTA file used in the cdsearch stage.
  #
  # This should be the same FASTA file used by:
  #   configs/stages/cdsearch.yaml
  query_fasta: data/processed/query.fasta

  # Full detailed CD-Search result table generated by the cdsearch stage.
  #
  # This file contains all parsed RPS-BLAST/CD-Search hits and is used to
  # retrieve the complete alignment information for the selected PSSM IDs.
  cdsearch_all_hits: results/cdsearch/cdsearch_all_hits_detailed.tsv

  # Selected top1 PSSM table.
  #
  # By default, this points to the default top1 proposal generated by
  # the cdsearch stage:
  #
  #   results/cdsearch/cdsearch_default_top1.tsv
  #
  # If users want to manually override the selected PSSM_ID, copy the
  # default proposal first:
  #
  #   cp results/cdsearch/cdsearch_default_top1.tsv \
  #      results/cdsearch/cdsearch_selected_top1.tsv
  #
  # Then edit the selected_PSSM_ID column and change this path to:
  #
  #   results/cdsearch/cdsearch_selected_top1.tsv
  selected_top1: results/cdsearch/cdsearch_selected_top1.tsv

# Algorithm / tool parameters (affect scientific results)
parameters:
  # No scientific parameters are currently required for this stage.
  #
  # Domain extraction is fully determined by:
  #   1. cdsearch_all_hits
  #   2. selected_top1
  #
  # This section is kept for consistency with other pipeline stage configs.

# Pipeline outputs (where artifacts will be written)
outputs:
  # Output root for selected CD-Search domain extraction.
  #
  # This stage will generate:
  #   selected_domain_hits_detailed.tsv
  #   alignment_blocks/
  #   domains_fasta/query/
  #   domains_fasta/query_with_gap/
  #   domains_fasta/hseq_with_gap/
  extract_root: results/cdsearch_extract

# Execution behavior (does not affect scientific results)
execution:
  # If true, remove the existing extract_root before running.
  overwrite: false