# Pipeline inputs (what data this pipeline operates on)
inputs:
  # Original full-length protein FASTA.
  #
  # This must be the same FASTA used in cdsearch, pssm_reconstruct,
  # and scorecons_integrate stages.
  query_fasta: data/processed/query.fasta

  # Integrated full-length tables generated by scorecons_integrate.
  #
  # Expected files:
  #   results/pssm/integrated/{query_id}.tsv
  integrated_dir: results/pssm/integrated

  # External ConSurf grades directory.
  #
  # These files are generated outside this pipeline and should be prepared before running.
  #
  # Supported naming patterns:
  #   {query_id}_*_consurf_grades.txt
  #   {uniprot}_*_consurf_grades.txt
  #   {uniprot}_consurf_grades.txt
  consurf_dir: data/external/conservation/consurf

# Algorithm / tool parameters (affect scientific results)
parameters:
  # Amino-acid column order used by the original Branch B implementation.
  # Keep this unchanged to preserve matrix compatibility.
  aa_order: GAILVMFWPCSTYNQHKRDE

  # Local sequence mapping parameters used to align ConSurf sequence
  # back to the original full-length query sequence.
  #
  # These match the original implementation defaults.
  window: 25
  max_mismatch: 5

# Pipeline outputs (where artifacts will be written)
outputs:
  # ConSurf integration updates the existing integrated tables in place.
  #
  # This intentionally points to the same directory as inputs.integrated_dir.
  integrated_dir: results/pssm/integrated

# Execution behavior (does not affect scientific results)
execution:
  # If true, overwrite the "Evolutionary conservation" column if it already exists.
  #
  # The original implementation always overwrites this column when rerun.
  overwrite_existing_column: true