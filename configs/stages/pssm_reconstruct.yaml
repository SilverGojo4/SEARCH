# Pipeline inputs (what data this pipeline operates on)
inputs:
  # Original full-length protein FASTA.
  #
  # This must be the same FASTA used in the cdsearch stage.
  # The reconstruction stage uses this file to recover full-length
  # protein coordinates and residue identities.
  query_fasta: data/processed/query.fasta

  # CD-Search top-hit table generated by the cdsearch stage.
  #
  # Required columns include:
  #   - query_id
  #   - PSSM_ID
  #   - qstart
  #   - qend
  #   - qseq
  #   - hseq
  cdsearch_table: results/cdsearch_extract/selected_domain_hits_detailed.tsv

  # Domain-level PSSM matrices generated by the smp_parse stage.
  #
  # Expected file naming convention:
  #   {query_id}_{pssm_id}_hseq_with_gap.tsv
  matrix_dir: results/pssm/matrices

# Algorithm / tool parameters (affect scientific results)
parameters:
  # Amino-acid column order used by the original Branch B implementation.
  # Keep this unchanged to preserve matrix compatibility.
  aa_order: GAILVMFWPCSTYNQHKRDE

# Pipeline outputs (where artifacts will be written)
outputs:
  # Full-length reconstructed PSSM matrices.
  #
  # Output file naming convention:
  #   {query_id}.tsv
  reconstruct_output_dir: results/pssm/reconstruct

# Execution behavior (does not affect scientific results)
execution:
  # If true, remove the existing reconstruct_output_dir before running.
  overwrite: false

  # If true, skip reconstructed TSV files that already exist.
  resume: true