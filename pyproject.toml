[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search"
version = "0.1.0"
description = "A CLI-first, config-driven pipeline for CD-Search, PSSM extraction, and mutation-site analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Silver Gojo", email = "SilverGojo4@gmail.com" }
]

dependencies = [
  "biopython>=1.80,<2",
  "pandas>=2.0,<3",
  "numpy>=1.23,<3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.5",
  "seaborn>=0.11",
]

dev = [
  "pytest>=7.0",
  "ruff>=0.4.0",
  "mypy>=1.8",
]

[project.scripts]
search = "search.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]